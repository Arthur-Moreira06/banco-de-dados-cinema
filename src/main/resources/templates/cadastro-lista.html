<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${cadastro.titulo()} + ' | FRAMEMARK'">Cadastros</title><link rel="stylesheet" th:href="@{/css/cinema.css(v=9)}"><script defer th:src="@{/js/tema.js}"></script></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="container"><a class="back-link" href="/gerente">← Voltar ao menu do gerente</a><div class="page-heading"><div><span class="eyebrow">ÁREA GERENCIAL</span><h1 th:text="${cadastro.titulo()}">Cadastro</h1><p>Consulte e mantenha os registros.</p></div><a class="primary-button" th:href="@{/gerente/cadastros/{tipo}/novo(tipo=${cadastro.tipo()})}">+ Novo cadastro</a></div><div class="alert" th:if="${erro}" th:text="${erro}"></div><div class="success" th:if="${sucesso}" th:text="${sucesso}"></div><div class="table-wrap"><table><thead><tr><th th:each="coluna : ${colunas}" th:text="${coluna.rotulo()}">Coluna</th><th>Ações</th></tr></thead><tbody><tr th:if="${#lists.isEmpty(linhas)}"><td class="empty" th:colspan="${#lists.size(colunas) + 1}">Nenhum registro encontrado.</td></tr><tr th:each="linha : ${linhas}"><td th:each="coluna : ${colunas}" th:text="${linha[coluna.chave()]}">valor</td><td><div class="row-actions"><a class="text-link" th:href="@{/gerente/cadastros/{tipo}/{id}/editar(tipo=${cadastro.tipo()},id=${linha['id']})}">Editar</a><form method="post" th:action="@{/gerente/cadastros/{tipo}/{id}/excluir(tipo=${cadastro.tipo()},id=${linha['id']})}" onsubmit="return confirm('Confirma a exclusão deste registro?')"><button class="danger-link" type="submit">Excluir</button></form></div></td></tr></tbody></table></div></main></body></html>
