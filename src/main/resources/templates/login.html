<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cinema | Entrar</title><link rel="stylesheet" th:href="@{/css/cinema.css}"><script defer th:src="@{/js/tema.js}"></script></head><body class="login-page"><button class="theme-switch login-theme-toggle" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="Alternar tema"><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span></button><main class="card login-card"><span class="eyebrow">SISTEMA DE CINEMA</span><h1>Entrar</h1><p>Use seu login de funcionário.</p><div class="alert" th:if="${mensagem}" th:text="${mensagem}"></div><div class="success" th:if="${param.logout}">Você saiu da conta.</div><form method="post" th:action="@{/login}" th:object="${formulario}"><label for="login">Login</label><input id="login" th:field="*{login}" autocomplete="username" required autofocus><label for="senha">Senha</label><input id="senha" type="password" th:field="*{senha}" autocomplete="current-password" required><button type="submit">Acessar</button></form></main></body></html>
