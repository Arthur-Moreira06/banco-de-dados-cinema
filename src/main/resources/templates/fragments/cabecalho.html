<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="topbar" th:fragment="cabecalho">
  <a class="brand" th:href="@{/}">CINEMA</a>
  <nav class="top-actions" aria-label="Conta e aparência">
    <div class="notification-menu" data-notification-menu th:if="${usuario.gerente()}" th:attr="data-manager-id=${usuario.id()}">
      <button class="notification-toggle" type="button" data-notification-toggle aria-expanded="false" aria-controls="manager-notifications" aria-label="Notificações">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path><path d="M10 21h4"></path></svg>
        <span class="notification-badge" data-notification-badge hidden></span>
      </button>
      <section class="notification-panel" id="manager-notifications" data-notification-panel hidden aria-label="Notificações de vendas">
        <div class="notification-panel__heading"><strong>Vendas recentes</strong><span data-notification-caption>Últimas vendas registradas</span></div>
        <ol class="notification-list" data-notification-list aria-live="polite"><li class="notification-empty">Carregando vendas…</li></ol>
      </section>
    </div>
    <div class="user-menu" data-user-menu>
      <button class="user-trigger" type="button" data-user-menu-toggle aria-expanded="false" aria-haspopup="true">
        <span class="user-avatar" aria-hidden="true" th:text="${usuario.iniciais()}">AG</span>
        <span class="user-trigger-info"><strong th:text="${usuario.nome()}">Nome do usuário</strong><small th:text="${usuario.cargo()}">Cargo</small></span>
        <span class="user-chevron" aria-hidden="true">⌄</span>
      </button>
      <section class="user-dropdown" data-user-dropdown hidden aria-label="Menu do usuário">
        <div class="dropdown-profile">
          <span class="user-avatar user-avatar-large" aria-hidden="true" th:text="${usuario.iniciais()}">AG</span>
          <span><strong th:text="${usuario.nome()}">Nome do usuário</strong><small th:text="|${usuario.cargo()} · ${usuario.perfil()}|">Cargo · Perfil</small></span>
        </div>
        <div class="dropdown-preference"><span>Aparência</span><button class="theme-switch" type="button" data-theme-toggle role="switch" aria-checked="false" aria-label="Ativar tema escuro"><span class="theme-switch-track" aria-hidden="true"><span class="theme-switch-thumb"></span></span></button></div>
        <a class="dropdown-link" th:href="@{/perfil}">Informações pessoais</a>
        <form method="post" th:action="@{/sair}"><button class="dropdown-link dropdown-logout" type="submit">Sair da conta</button></form>
      </section>
    </div>
  </nav>
  <script defer th:src="@{/js/menu-usuario.js}"></script>
  <script defer th:src="@{/js/notificacoes-gerente.js(v=1)}"></script>
</header>
</body>
</html>
