<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Venda de produtos | Cinema</title><link rel="stylesheet" th:href="@{/css/cinema.css}"><script defer th:src="@{/js/tema.js}"></script></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="container form-container"><a class="back-link" href="/funcionario">← Voltar à área do funcionário</a><div class="form-card"><span class="eyebrow">BOMBONIERE</span><h1>Vender produtos</h1><p>O estoque e o pagamento são atualizados juntos na venda.</p><div class="alert" th:if="${erro}" th:text="${erro}"></div><div class="success" th:if="${sucesso}" th:text="${sucesso}"></div><form class="data-form" method="post" th:action="@{/funcionario/vendas-produtos}"><div class="field"><label for="produtoId">Produto</label><select id="produtoId" name="produtoId" required><option value="">Selecione</option><option th:each="p : ${produtos}" th:value="${p.id}" th:text="|${p.nome} — R$ ${p.preco} (estoque: ${p.estoque})|"></option></select></div><div class="field"><label for="quantidade">Quantidade</label><input id="quantidade" name="quantidade" type="number" min="1" value="1" required></div><div class="field"><label for="clienteId">Cliente (opcional)</label><select id="clienteId" name="clienteId"><option value="">Venda sem cadastro de cliente</option><option th:each="c : ${clientes}" th:value="${c.id}" th:text="|${c.nome} (ID ${c.id})|"></option></select></div><div class="field"><label for="pagamento">Forma de pagamento</label><select id="pagamento" name="pagamento" required><option value="Dinheiro">Dinheiro</option><option value="Cartao_Credito">Cartão de crédito</option><option value="Cartao_Debito">Cartão de débito</option><option value="Pix">Pix</option></select></div><div class="form-actions"><a class="secondary-button" href="/funcionario">Cancelar</a><button class="primary-button" type="submit">Registrar venda</button></div></form></div></main></body></html>
