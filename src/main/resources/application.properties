spring.application.name=cinema-web
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${CINEMA_DB_URL:jdbc:mysql://localhost:3306/cinema?serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${CINEMA_DB_USER:cinema_app}
spring.datasource.password=${CINEMA_DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=SET ROLE ALL
spring.thymeleaf.cache=false
server.error.include-message=never
