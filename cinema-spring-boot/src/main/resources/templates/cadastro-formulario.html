<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Formulário | Cinema</title><link rel="stylesheet" th:href="@{/css/cinema.css}"><script defer th:src="@{/js/tema.js}"></script></head><body><header th:replace="~{fragments/cabecalho :: cabecalho}"></header><main class="container form-container"><a class="back-link" th:href="@{/gerente/cadastros/{tipo}(tipo=${cadastro.tipo()})}">← Voltar a <span th:text="${cadastro.titulo()}">cadastros</span></a><div class="form-card"><span class="eyebrow">ÁREA GERENCIAL</span><h1 th:text="${id == null ? 'Novo cadastro' : 'Editar cadastro'}">Cadastro</h1><p th:text="${cadastro.titulo()}">Categoria</p><div class="alert" th:if="${erro}" th:text="${erro}"></div><form class="data-form" method="post" th:action="@{/gerente/cadastros/{tipo}/salvar(tipo=${cadastro.tipo()})}"><input type="hidden" name="id" th:if="${id != null}" th:value="${id}"><div class="field" th:each="campo : ${cadastro.campos()}"><label th:for="${campo.nome()}" th:text="${campo.rotulo()}">Campo</label><select th:if="${campo.tipo() == 'select'}" th:id="${campo.nome()}" th:name="${campo.nome()}" th:required="${campo.obrigatorio()}"><option value="" th:if="${!campo.obrigatorio()}" selected>— Selecione —</option><option th:each="opcao : ${campo.opcoes()}" th:value="${opcao}" th:text="${opcao}" th:selected="${valores[campo.nome()] == opcao}"></option></select><textarea th:if="${campo.tipo() == 'textarea'}" th:id="${campo.nome()}" th:name="${campo.nome()}" th:required="${campo.obrigatorio()}" th:text="${valores[campo.nome()]}"></textarea><input th:if="${campo.tipo() != 'select' and campo.tipo() != 'textarea'}" th:id="${campo.nome()}" th:name="${campo.nome()}" th:type="${campo.tipo()}" th:required="${campo.obrigatorio()}" th:value="${valores[campo.nome()]}" th:step="${campo.tipo() == 'decimal' ? '0.01' : null}" th:min="${campo.tipo() == 'number' or campo.tipo() == 'decimal' ? '0' : null}" autocomplete="off"></div><div class="form-actions"><a class="secondary-button" th:href="@{/gerente/cadastros/{tipo}(tipo=${cadastro.tipo()})}">Cancelar</a><button class="primary-button" type="submit">Salvar</button></div></form></div></main></body></html>
